on: [pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify cmdlet documentation
        run: ./build/Test-CmdletDocumentationSync.ps1
        shell: pwsh
      - name: Install Prerequisites
        run: ./build/vsts-prerequisites.ps1
        shell: pwsh
      - name: Validate
        run: ./build/vsts-validate.ps1
        shell: pwsh
